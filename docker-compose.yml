version: '3.8'

services:
  paseo-daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    container_name: paseo-daemon
    volumes:
      - paseo-home:/data/paseo
      - feltdb-data:/data/feltdb
    environment:
      NODE_ENV: production
      PASEO_HOME: /data/paseo
      FELTDB_PATH: /data/feltdb
    ports:
      - "6767:6767"
    restart: unless-stopped
    networks:
      - paseo-network
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:6767/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  paseo-home:
    driver: local
  feltdb-data:
    driver: local

networks:
  paseo-network:
    driver: bridge
